<body class="menu-page emenu-layout" data-menu-theme="gold">
<script>
(function () {
    function applyEmenuThemeCssVars(b, t) {
        if (!b || !t) return;
        b.setAttribute('data-menu-theme', t.id || 'gold');
        if (t.light) b.classList.add('light-mode'); else b.classList.remove('light-mode');
        b.style.setProperty('--emenu-accent', t.accent);
        b.style.setProperty('--emenu-accent-hover', t.accentHover || t.accent);
        b.style.setProperty('--emenu-accent-glow', t.accentGlow);
        b.style.setProperty('--emenu-accent-gradient', t.accentGradient || t.accent);
        b.style.setProperty('--emenu-brown', t.accent);
        b.style.setProperty('--heading-accent', t.accent);
        b.style.setProperty('--heading-fg', t.accent);
        b.style.setProperty('--emenu-bg', t.bg);
        b.style.setProperty('--emenu-cat-bg', t.cat);
        b.style.setProperty('--emenu-card-bg', t.card);
        b.style.setProperty('--emenu-surface', t.surface);
        b.style.setProperty('--emenu-pill-bg', t.pill);
        b.style.setProperty('--emenu-fab-bg', t.fab);
        b.style.setProperty('--emenu-text', t.text);
        b.style.setProperty('--emenu-text-muted', t.textMuted || '#9E9EA8');
        b.style.setProperty('--emenu-border', t.border);
        b.style.setProperty('--emenu-fab-text', t.fabText);
        b.style.setProperty('--emenu-curve', t.bg);
        b.style.setProperty('--emenu-hero-accent', t.accent);
        b.style.setProperty('--emenu-fab-accent', t.accent);
        b.style.setProperty('--emenu-fab-border', t.border);
        b.style.setProperty('--emenu-fab-accent-ring', t.accentGlow);
        b.style.setProperty('--emenu-fab-accent-ring-strong', t.accent);
    }

    var themes = {

            id: 'gold',
            name: 'Royal Gold',
            light: false,
            meta: '#D4AF37',
            accent: '#D4AF37',
            accentHover: '#E5C158',
            accentGlow: 'rgba(212, 175, 55, 0.45)',

            cat: '#211E1A',
            card: '#292520',
            surface: '#292520',
            pill: '#363028',
            fab: '#292520',
            text: '#FFF9EE',
            textMuted: '#C4B59D',
            border: 'rgba(212, 175, 55, 0.28)',

        amber: {
            id: 'amber',
            name: 'Damascus Amber',
            light: false,
            meta: '#FB923C',
            accent: '#FB923C',
            accentHover: '#FDBA74',
            accentGlow: 'rgba(251, 146, 60, 0.45)',
            accentGradient: 'linear-gradient(135deg, #FED7AA 0%, #FB923C 50%, #C2410C 100%)',
            bg: '#2E1809',
            cat: '#3B200D',
            card: '#4A2912',
            surface: '#4A2912',
            pill: '#5C3317',
            fab: '#4A2912',
            text: '#FFF7ED',
            textMuted: '#FDBA74',
            border: 'rgba(251, 146, 60, 0.3)',
            fabText: '#FFF7ED'

        emerald: {
            id: 'emerald',

            meta: '#34D399',
            accent: '#34D399',

            accentGlow: 'rgba(52, 211, 153, 0.45)',
            accentGradient: 'linear-gradient(135deg, #A7F3D0 0%, #34D399 50%, #065F46 100%)',
            bg: '#09281C',
            cat: '#0E3827',
            card: '#144A34',
            surface: '#144A34',
            pill: '#1B5C42',
            fab: '#144A34',
            text: '#F0FDF4',
            textMuted: '#A7F3D0',
            border: 'rgba(52, 211, 153, 0.3)',
            fabText: '#F0FDF4'
        },
        ruby: {
            id: 'ruby',
            name: 'Ruby Royale',
            light: false,
            meta: '#FB7185',
            accent: '#FB7185',
            accentHover: '#FDA4AF',
            accentGlow: 'rgba(251, 113, 133, 0.45)',
            accentGradient: 'linear-gradient(135deg, #FECDD3 0%, #FB7185 50%, #9F1239 100%)',
            bg: '#2C0B14',
            cat: '#3C101C',
            card: '#4D1625',
            surface: '#4D1625',
            pill: '#5F1C2E',
            fab: '#4D1625',
            text: '#FFF1F2',
            textMuted: '#FDA4AF',
            border: 'rgba(251, 113, 133, 0.3)',
            fabText: '#FFF1F2'
        },
        sapphire: {

            cat: '#15274B',
            card: '#1B325F',
            surface: '#1B325F',
            pill: '#234076',
            fab: '#1B325F',
            text: '#F8FAFC',
            textMuted: '#93C5FD',
            border: 'rgba(56, 189, 248, 0.3)',
            fabText: '#F8FAFC'
        },
        ivory: {
            id: 'ivory',
            name: 'Ivory Palace',
            light: true,
            meta: '#A76535',
            accent: '#A76535',
            accentHover: '#BD7640',
            accentGlow: 'rgba(167, 101, 53, 0.35)',
            accentGradient: 'linear-gradient(135deg, #E2C09A 0%, #A76535 50%, #6E3B14 100%)',
            bg: '#F7F2EA',
            cat: '#EDE4D5',
            card: '#FFFFFF',
            surface: '#FFFFFF',
            pill: '#FFFFFF',
            fab: '#FFFFFF',
            text: '#281B10',
            textMuted: '#78604F',
            border: 'rgba(167, 101, 53, 0.22)',
            fabText: '#5C4535'

            textMuted: '#D8B4FE',
            border: 'rgba(192, 132, 252, 0.3)',
            fabText: '#FAF5FF'
        }
    };

    var id = localStorage.getItem('menuTheme') || 'gold';
    if (!themes[id]) id = 'gold';
    applyEmenuThemeCssVars(document.body, themes[id]);
    window.MENU_THEMES = themes;
    window.applyEmenuThemeCssVars = applyEmenuThemeCssVars;
})();

    <header class="menu-hero">
        <video class="menu-hero-video" autoplay muted loop playsinline webkit-playsinline preload="auto">
            <source src="images/new-shawarma-video.mp4" type="video/mp4">
        </video>
        <div class="menu-hero-shade"></div>
        <div class="menu-hero-brand" id="menuHeroBrand">
            <div class="menu-hero-logo-wrap">
                <img src="assets/shawarma demeshq-logo.jpg?v=1" alt="Shawarma" class="menu-hero-logo" id="menuHeroLogo" onerror="this.onerror=null; this.src='assets/logo.svg';">

            </div>
            <h1 class="menu-hero-title">

        </div>
        <div class="menu-hero-curve" aria-hidden="true">

            <div class="theme-dropdown-menu fab-theme-menu" id="themeDropdownMenu">
                <button type="button" class="theme-option active" data-theme="gold">

                <button type="button" class="theme-option" data-theme="amber">
                    <span class="theme-swatch theme-swatch-amber"></span>
                    <span class="theme-name" data-i18n="themeDamascusAmber">Damascus Amber</span>
                </button>
                <button type="button" class="theme-option" data-theme="emerald">
                    <span class="theme-swatch theme-swatch-emerald"></span>
                    <span class="theme-name" data-i18n="themeEmeraldSultan">Emerald Sultan</span>
                </button>
                <button type="button" class="theme-option" data-theme="ruby">
                    <span class="theme-swatch theme-swatch-ruby"></span>

                </button>
                <button type="button" class="theme-option" data-theme="sapphire">

                    <span class="theme-name" data-i18n="themeSapphireNight">Sapphire Night</span>
                </button>
                <button type="button" class="theme-option" data-theme="ivory">

        <button class="menu-fab menu-fab-fav" id="favBtn" type="button" aria-label="Favorites" title="Favorites">

            </svg>
            <span class="fav-badge" id="favBadge">0</span>

        </button>

        <div class="detail-panel" id="detailPanel">
            <button class="detail-close" id="detailClose" aria-label="Close">✕</button>
